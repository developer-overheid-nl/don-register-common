kind: Added
body: '`FilterGroup` heeft een optioneel `showTop` voor het filtertype `search-select`: hoeveel opties de frontend toont voordat de gebruiker zoekt of uitklapt. `Validate` accepteert `showTop` alleen bij `search-select` en vanaf 1. `SortOptionsByCount` zet de opties met de meeste treffers bovenaan.'
