kind: Added
body: '`FilterGroup` heeft een optioneel `showTop` voor de filtertypes `search-single-select` en `search-multi-select` (constanten `TypeSearchSingleSelect` en `TypeSearchMultiSelect`): hoeveel opties de frontend toont voordat de gebruiker zoekt of uitklapt. `Validate` accepteert `showTop` alleen bij die twee types en vanaf 1; het verouderde `search-select` hoort daar niet bij. `SortOptionsByCount` zet de opties met de meeste treffers bovenaan.'
time: 2026-11-12T12:00:00+01:00
