name: JSON/YAML CI

on: pull_request

jobs:
  lint-and-validate:
    name: JSON & YAML Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Run Super-Linter
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_JSON: true
          VALIDATE_YAML: true
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: true
