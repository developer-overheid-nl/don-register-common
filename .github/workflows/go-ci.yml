name: Go CI

on: push

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Setup Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: "go.mod"
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Setup Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: "go.mod"
      - name: Run tests
        run: go test -coverprofile coverage.out ./...
